<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="星格测试 - 动漫风MBTI性格测评，测完即走，不留数据">
<title>星格测试 | 动漫风MBTI性格测评</title>
<style>
/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --radius:16px;
  --radius-sm:10px;
  --transition:300ms cubic-bezier(.4,0,.2,1);
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
  --c-bg:#f8f6ff;
  --c-card:#fff;
  --c-text:#333;
  --c-text-light:#888;
  --c-primary:#7c5cfc;
  --c-primary-light:#a78bfa;
  --c-primary-bg:#f0ebff;
  --c-accent:#ff6b9d;
  --c-green:#4fd1a4;
  --c-blue:#5b9ef5;
  --c-yellow:#f5b942;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:linear-gradient(135deg,#f5f0ff 0%,#fff5f8 50%,#f0f5ff 100%);
  color:var(--c-text);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* ========== 背景装饰 ========== */
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-deco span{position:absolute;border-radius:50%;opacity:.15;animation:float 8s ease-in-out infinite}
.bg-deco span:nth-child(1){width:180px;height:180px;background:var(--c-primary);top:-40px;left:-40px;animation-delay:0s}
.bg-deco span:nth-child(2){width:120px;height:120px;background:var(--c-accent);top:20%;right:-30px;animation-delay:1s}
.bg-deco span:nth-child(3){width:200px;height:200px;background:var(--c-blue);bottom:-60px;left:30%;animation-delay:2s}
.bg-deco span:nth-child(4){width:100px;height:100px;background:var(--c-green);top:60%;left:-20px;animation-delay:3s}
.bg-deco span:nth-child(5){width:140px;height:140px;background:var(--c-yellow);top:10%;left:40%;animation-delay:1.5s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.05)}66%{transform:translate(-15px,20px) scale(.95)}}

/* ========== 容器 ========== */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:24px 16px;min-height:100vh;display:flex;flex-direction:column}

/* ========== 开始页 ========== */
.page{display:none;flex:1;flex-direction:column;animation:fadeIn .4s ease}
.page.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* start page */
.start-page{justify-content:center;align-items:center;text-align:center;gap:20px}
.logo-area{margin-bottom:8px}
.logo-emoji{font-size:3rem;display:block;margin-bottom:8px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.app-title{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.app-subtitle{font-size:.95rem;color:var(--c-text-light);margin-top:4px}
.info-tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.info-tag{background:var(--c-card);padding:6px 14px;border-radius:20px;font-size:.8rem;color:var(--c-text-light);box-shadow:var(--shadow);border:1px solid rgba(124,92,252,.1)}
.start-btn{
  background:linear-gradient(135deg,var(--c-primary),var(--c-accent));
  color:#fff;border:none;padding:14px 48px;font-size:1.1rem;font-weight:700;
  border-radius:30px;cursor:pointer;box-shadow:0 4px 15px rgba(124,92,252,.35);
  transition:var(--transition);font-family:var(--font);letter-spacing:1px;
}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,92,252,.45)}
.start-btn:active{transform:translateY(0)}
.privacy-note{font-size:.75rem;color:var(--c-text-light);max-width:320px;line-height:1.5}

/* ========== 答题页 ========== */
.quiz-page{justify-content:flex-start;padding-top:20px}
.progress-bar-wrap{margin-bottom:24px}
.progress-info{display:flex;justify-content:space-between;font-size:.8rem;color:var(--c-text-light);margin-bottom:8px}
.progress-bar{height:8px;background:var(--c-primary-bg);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--c-primary),var(--c-accent));border-radius:4px;transition:width .4s ease;width:0}
.question-area{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}
.q-number{font-size:.85rem;color:var(--c-primary);font-weight:600}
.q-text{font-size:1.15rem;font-weight:600;line-height:1.6;text-align:center;padding:0 8px}
.options{display:flex;flex-direction:column;gap:12px}
.option-card{
  background:var(--c-card);border:2px solid #eee;border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;transition:var(--transition);font-size:.95rem;
  display:flex;align-items:flex-start;gap:10px;line-height:1.5;position:relative;overflow:hidden;
}
.option-card:hover{border-color:var(--c-primary);box-shadow:var(--shadow);transform:translateY(-1px)}
.option-card.selected{border-color:var(--c-primary);background:var(--c-primary-bg);box-shadow:0 4px 15px rgba(124,92,252,.2)}
.option-card .opt-label{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#f0f0f0;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--c-text-light);
  transition:var(--transition)
}
.option-card.selected .opt-label{background:var(--c-primary);color:#fff}
.option-card .opt-text{flex:1}
.option-card::after{
  content:"✓";position:absolute;right:16px;top:50%;transform:translateY(-50%) scale(0);
  color:var(--c-primary);font-size:1.2rem;transition:var(--transition)
}
.option-card.selected::after{transform:translateY(-50%) scale(1)}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.nav-btn{
  background:var(--c-card);border:1px solid #ddd;border-radius:20px;padding:8px 20px;
  font-size:.85rem;cursor:pointer;color:var(--c-text-light);transition:var(--transition);font-family:var(--font)
}
.nav-btn:hover{border-color:var(--c-primary);color:var(--c-primary)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.next{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.nav-btn.next:hover{background:var(--c-primary-light);border-color:var(--c-primary-light)}

/* ========== 结果页 ========== */
.result-page{justify-content:flex-start;gap:16px;padding-top:12px}
.result-header{text-align:center;margin-bottom:4px}
.result-emoji{font-size:3.5rem;display:block;margin-bottom:8px;animation:popIn .5s ease}
@keyframes popIn{0%{transform:scale(0)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
.result-type{font-size:2.2rem;font-weight:800;letter-spacing:3px}
.result-name{font-size:1.1rem;color:var(--c-text-light);margin-top:2px}
.result-group{display:inline-block;font-size:.75rem;padding:2px 12px;border-radius:12px;margin-top:8px;font-weight:600}
.result-card{background:var(--c-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);width:100%}
.dim-section{margin-bottom:16px}
.dim-section:last-child{margin-bottom:0}
.dim-title{font-size:.8rem;color:var(--c-text-light);margin-bottom:6px;font-weight:600}
.dim-bar-wrap{position:relative;height:24px;background:#f5f5f5;border-radius:12px;overflow:hidden}
.dim-bar-label{position:absolute;top:0;height:100%;display:flex;align-items:center;padding:0 10px;font-size:.75rem;font-weight:700;z-index:2;color:var(--c-text)}
.dim-bar-label.left{left:0}
.dim-bar-label.right{right:0}
.dim-bar-fill{position:absolute;top:0;height:100%;border-radius:12px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.dim-bar-pct{position:absolute;top:50%;transform:translateY(-50%);font-size:.7rem;font-weight:700;z-index:3}
.desc-section{margin-top:16px}
.desc-section h3{font-size:.85rem;color:var(--c-primary);margin-bottom:8px;font-weight:700}
.desc-text{font-size:.9rem;line-height:1.7;color:var(--c-text)}
.tags-section{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag-chip{font-size:.75rem;padding:4px 10px;border-radius:12px;background:var(--c-primary-bg);color:var(--c-primary);font-weight:600}
.disclaimer{
  background:#fff9e6;border:1px solid #ffe08a;border-radius:var(--radius-sm);
  padding:12px 14px;font-size:.78rem;color:#8a6d3b;line-height:1.6;text-align:center;
}
.disclaimer strong{color:#665428}
.result-actions{display:flex;gap:12px;margin-top:4px}
.result-actions button{flex:1;padding:12px;border-radius:24px;font-size:.95rem;font-weight:700;border:none;cursor:pointer;font-family:var(--font);transition:var(--transition)}
.btn-retest{background:var(--c-card);border:2px solid #ddd !important;color:var(--c-text-light)}
.btn-retest:hover{border-color:var(--c-primary) !important;color:var(--c-primary)}
.btn-share{background:linear-gradient(135deg,var(--c-primary),var(--c-accent));color:#fff;box-shadow:0 4px 12px rgba(124,92,252,.3)}
.btn-share:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(124,92,252,.4)}

/* ========== 分享卡片弹层 ========== */
.card-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:16px}
.card-modal.show{display:flex;animation:fadeIn .3s ease}
.card-canvas-wrap{max-width:90%;max-height:75vh;overflow:hidden;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
#cardCanvas{display:block;max-width:100%;max-height:75vh}
.card-modal .hint{color:rgba(255,255,255,.8);font-size:.85rem;text-align:center}
.card-close{background:rgba(255,255,255,.2);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.card-close:hover{background:rgba(255,255,255,.35)}

/* ========== 页脚 ========== */
.footer{text-align:center;font-size:.7rem;color:var(--c-text-light);padding:12px 0 8px}

/* ========== 响应式 ========== */
@media(max-width:380px){
  .app{padding:16px 12px}
  .app-title{font-size:1.7rem}
  .q-text{font-size:1.05rem}
  .option-card{padding:14px 14px;font-size:.9rem}
}
@media(min-width:768px){
  .app{max-width:560px;padding:40px 24px}
  .logo-emoji{font-size:3.5rem}
  .app-title{font-size:2.4rem}
}
</style>
</head>
<body>
<div class="bg-deco"><span></span><span></span><span></span><span></span><span></span></div>
<div class="app">

    careers:["演员","主持人","活动策划","导游","时尚买手"]},

/* ========== 维度配色 ========== */
const DIM_COLORS = {E:"#ff6b9d",I:"#7c5cfc",S:"#5b9ef5",N:"#4fd1a4",T:"#f5b942",F:"#ff6b9d",J:"#8a6fd1",P:"#f5b942"};
const DIM_LABELS = {EI:["E 外向","I 内向"],SN:["S 实感","N 直觉"],TF:["T 思考","F 情感"],JP:["J 判断","P 知觉"]};

/* ========== 状态管理 ========== */
let currentQ = 0;           // 当前题目索引 0-19
let answers = [];           // 用户答案数组，元素为 "E"/"I"/"S"/"N"...
let scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};

/* ========== 开始/重置 ========== */
function startQuiz(){
  currentQ = 0;
  answers = new Array(20).fill(null);
  scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  showPage("pageQuiz");
  renderQuestion();
}

function resetQuiz(){
  showPage("pageStart");
  currentQ = 0;
  answers = [];
  scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
}

/* ========== 渲染题目 ========== */
function renderQuestion(){
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;
  // 进度
  const progress = (currentQ + 1) / total * 100;
  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("progressText").textContent = `第 ${currentQ + 1} / ${total} 题`;
  document.getElementById("progressPct").textContent = Math.round(progress) + "%";
  // 题号和题干
  document.getElementById("qNumber").textContent = `Q.${String(currentQ + 1).padStart(2,"0")}`;
  document.getElementById("qText").textContent = q.q;
  // 选项
  const optsDiv = document.getElementById("options");
  const sel = answers[currentQ];
  optsDiv.innerHTML = `
    <div class="option-card ${sel===q.a_score?'selected':''}" onclick="selectOption(0)">
      <div class="opt-label">A</div><div class="opt-text">${q.a}</div>
    </div>
    <div class="option-card ${sel===q.b_score?'selected':''}" onclick="selectOption(1)">
      <div class="opt-label">B</div><div class="opt-text">${q.b}</div>
    </div>`;
  // 按钮
  document.getElementById("btnPrev").disabled = currentQ === 0;
  const btnNext = document.getElementById("btnNext");
  btnNext.disabled = !sel;
  btnNext.textContent = currentQ === total - 1 ? "查看结果" : "下一题";
}

/* ========== 选择选项 ========== */
function selectOption(idx){
  const q = QUESTIONS[currentQ];
  const score = idx === 0 ? q.a_score : q.b_score;
  answers[currentQ] = score;
  // 视觉选中
  const cards = document.querySelectorAll(".option-card");
  cards.forEach((c,i) => c.classList.toggle("selected", i === idx));
  // 启用下一题
  document.getElementById("btnNext").disabled = false;
  // 自动跳转（300ms 后）
  setTimeout(() => { if(answers[currentQ]) nextQuestion(); }, 300);
}

/* ========== 上一题/下一题 ========== */
function prevQuestion(){
  if(currentQ > 0){ currentQ--; renderQuestion(); }
}
function nextQuestion(){
  if(!answers[currentQ]) return;
  if(currentQ < QUESTIONS.length - 1){ currentQ++; renderQuestion(); }
  else { calculateResult(); }
}

/* ========== 计分判型 ========== */
function calculateResult(){
  // 重置
  scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  answers.forEach(a => { if(a) scores[a]++; });
  // 判型
  const type =
    (scores.E >= scores.I ? "E" : "I") +
    (scores.S >= scores.N ? "S" : "N") +
    (scores.T >= scores.F ? "T" : "F") +
    (scores.J >= scores.P ? "J" : "P");
  showResult(type);
}

/* ========== 渲染结果页 ========== */
function showResult(type){
  const data = MBTI_TYPES[type];
  showPage("pageResult");
  // 头部
  document.getElementById("resultEmoji").textContent = data.emoji;
  document.getElementById("resultType").textContent = type;
  document.getElementById("resultName").textContent = data.name;
  const groupEl = document.getElementById("resultGroup");
  groupEl.textContent = data.group;
  groupEl.style.background = data.groupColor + "20";
  groupEl.style.color = data.groupColor;
  // 四维度条
  renderDimBar("barEI","EI",scores.E,scores.I,DIM_LABELS.EI);
  renderDimBar("barSN","SN",scores.S,scores.N,DIM_LABELS.SN);
  renderDimBar("barTF","TF",scores.T,scores.F,DIM_LABELS.TF);
  renderDimBar("barJP","JP",scores.J,scores.P,DIM_LABELS.JP);
  // 描述
  document.getElementById("resultDesc").textContent = data.desc;
  // 职业
  const careers = data._careers || data.careers;
  document.getElementById("resultCareers").innerHTML =
    careers.map(c => `<span class="tag-chip">${c}</span>`).join("");
  // 保存当前结果供卡片使用
  window._resultType = type;
  window._resultData = data;
  window._resultScores = {...scores};
}

function renderDimBar(elId,dim,scoreA,scoreB,labels){
  const total = scoreA + scoreB || 1;
  const pctA = Math.round(scoreA / total * 100);
  const pctB = 100 - pctA;
  const aIsHigh = scoreA >= scoreB;
  const colorA = DIM_COLORS[dim[0]];
  const colorB = DIM_COLORS[dim[1]];
  const el = document.getElementById(elId);
  el.innerHTML = `
    <div class="dim-bar-label left" style="color:${aIsHigh?'#fff':'#666'}">${labels[0]}</div>
    <div class="dim-bar-label right" style="color:${!aIsHigh?'#fff':'#666'}">${labels[1]}</div>
    <div class="dim-bar-fill" style="width:0;background:${aIsHigh?colorA:colorB}"></div>
    <div class="dim-bar-pct" style="left:50%;transform:translate(-50%,-50%);color:#fff;background:${aIsHigh?colorA:colorB};padding:1px 6px;border-radius:8px">${aIsHigh?pctA:pctB}%</div>
  `;
  // 动画填充
  setTimeout(() => {
    const fill = el.querySelector(".dim-bar-fill");
    const highPct = aIsHigh ? pctA : pctB;
    fill.style.width = highPct + "%";
    // 如果是B更高，fill从右边开始
    if(!aIsHigh){ fill.style.right = "0"; fill.style.left = "auto"; fill.style.width = highPct + "%"; }
    else { fill.style.left = "0"; fill.style.right = "auto"; }
  }, 100);
}

/* ========== 分享卡片（Canvas） ========== */
function showCard(){
  const type = window._resultType;
  const data = window._resultData;
  const sc = window._resultScores;
  const canvas = document.getElementById("cardCanvas");
  const ctx = canvas.getContext("2d");
  const W = 750, H = 1000;

  // 背景渐变
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, data.groupColor + "15");
  grad.addColorStop(1, "#ffffff");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // 顶部装饰圆
  ctx.save();
  ctx.globalAlpha = .08;
  ctx.fillStyle = data.groupColor;
  ctx.beginPath(); ctx.arc(W-80, 100, 120, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60, H-120, 100, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 品牌名
  ctx.fillStyle = "#bbb";
  ctx.font = "600 24px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("星格测试 · MBTI", W/2, 50);

  // 大Emoji
  ctx.font = "120px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(data.emoji, W/2, 200);

  // 四字母大字
  ctx.fillStyle = data.groupColor;
  ctx.font = "800 100px sans-serif";
  ctx.fillText(type, W/2, 310);

  // 称号
  ctx.fillStyle = "#333";
  ctx.font = "700 42px sans-serif";
  ctx.fillText(data.name, W/2, 370);

  // slogan
  ctx.fillStyle = data.groupColor;
  ctx.font = "italic 28px sans-serif";
  ctx.fillText("「" + data.slogan + "」", W/2, 420);

  // 分隔线
  ctx.strokeStyle = "#eee";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(120, 460); ctx.lineTo(W-120, 460); ctx.stroke();

  // 四维度条
  const dims = [
    {label:"能量方向",a:"E",b:"I",av:sc.E,bv:sc.I,ca:DIM_COLORS.E,cb:DIM_COLORS.I},
    {label:"获取信息",a:"S",b:"N",av:sc.S,bv:sc.N,ca:DIM_COLORS.S,cb:DIM_COLORS.N},
    {label:"决策方式",a:"T",b:"F",av:sc.T,bv:sc.F,ca:DIM_COLORS.T,cb:DIM_COLORS.F},
    {label:"生活方式",a:"J",b:"P",av:sc.J,bv:sc.P,ca:DIM_COLORS.J,cb:DIM_COLORS.P},
  ];
  dims.forEach((d,i) => {
    const y = 500 + i * 70;
    const total = d.av + d.bv || 1;
    const aIsHigh = d.av >= d.bv;
    // 维度标签
    ctx.fillStyle = "#999";
    ctx.font = "600 20px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(d.label, 120, y);
    // 两端字母
    ctx.font = "700 22px sans-serif";
    ctx.fillStyle = aIsHigh ? d.ca : "#ccc";
    ctx.fillText(d.a, 120, y + 28);
    ctx.fillStyle = !aIsHigh ? d.cb : "#ccc";
    ctx.textAlign = "right";
    ctx.fillText(d.b, W - 120, y + 28);
    // 条
    const barX = 160, barW = W - 320, barY = y + 36, barH = 14;
    ctx.fillStyle = "#f0f0f0";
    roundRect(ctx, barX, barY, barW, barH, 7); ctx.fill();
    // 填充
    const highPct = aIsHigh ? d.av/total : d.bv/total;
    ctx.fillStyle = aIsHigh ? d.ca : d.cb;
    if(aIsHigh){
      roundRect(ctx, barX, barY, barW * highPct, barH, 7); ctx.fill();
    } else {
      const fillW = barW * highPct;
      roundRect(ctx, barX + barW - fillW, barY, fillW, barH, 7); ctx.fill();
    }
    // 百分比
    const pct = Math.round((aIsHigh ? d.av : d.bv) / total * 100);
    ctx.fillStyle = "#666";
    ctx.font = "700 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(pct + "%", W/2, y + 28);
  });

  // 底部引导
  ctx.fillStyle = "#ddd";
  ctx.font = "600 22px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("扫码/搜索「星格测试」也来测测 →", W/2, H - 80);
  ctx.fillStyle = "#ccc";
  ctx.font = "400 18px sans-serif";
  ctx.fillText(new Date().toLocaleDateString("zh-CN"), W/2, H - 50);

  // 显示弹层
  document.getElementById("cardModal").classList.add("show");
}

function closeCard(){
  document.getElementById("cardModal").classList.remove("show");
}

/* ========== 工具函数 ========== */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}
</script>
